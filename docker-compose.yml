version: '3.9'

services:
  video-render-service:
    build: .
    container_name: video-render-service
    restart: always
    expose:
      - "8080"

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - video-render-service