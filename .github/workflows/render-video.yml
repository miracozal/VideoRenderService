name: Render Video

on:
  workflow_dispatch:
    inputs:
      imageUrl:
        description: Public HTTP/HTTPS image URL
        required: true
        type: string

      market:
        description: Market music selection
        required: true
        type: string

      durationSeconds:
        description: Video duration between 3 and 30 seconds
        required: true
        default: "10"
        type: string

      requestId:
        description: Unique output identifier
        required: true
        type: string

      productName:
        description: Product name used in the Instagram caption
        required: false
        default: ""
        type: string

      price:
        description: Optional product price used in the Instagram caption
        required: false
        default: ""
        type: string


permissions:
  contents: write


concurrency:
  group: github-pages-video-render
  cancel-in-progress: false


jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      IMAGE_URL: ${{ inputs.imageUrl }}
      MARKET: ${{ inputs.market }}
      DURATION_SECONDS: ${{ inputs.durationSeconds }}
      REQUEST_ID: ${{ inputs.requestId }}
      PRODUCT_NAME: ${{ inputs.productName }}
      PRICE: ${{ inputs.price }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$DURATION_SECONDS" =~ ^[0-9]+$ ]] ||
             (( DURATION_SECONDS < 3 || DURATION_SECONDS > 30 )); then
            echo "durationSeconds must be an integer between 3 and 30."
            exit 1
          fi

          if [[ ! "$REQUEST_ID" =~ ^[A-Za-z0-9_-]{1,64}$ ]]; then
            echo "requestId may only contain letters, numbers, underscores and hyphens."
            exit 1
          fi

          if (( ${#MARKET} > 30 )); then
            echo "market may contain at most 30 characters."
            exit 1
          fi

          if (( ${#PRODUCT_NAME} > 150 )); then
            echo "productName may contain at most 150 characters."
            exit 1
          fi

          if (( ${#PRICE} > 30 )); then
            echo "price may contain at most 30 characters."
            exit 1
          fi


      - name: Check FFmpeg
        shell: bash
        run: |
          set -euo pipefail

          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "FFmpeg already installed."
            ffmpeg -version | head -n 1
          else
            echo "FFmpeg not found. Installing..."
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi


      - name: Download image safely
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p assets

          echo "Downloading source image..."

          python3 - <<'PY'
          import os
          import urllib.parse

          url = os.environ["IMAGE_URL"]
          parsed = urllib.parse.urlparse(url)

          print("Image host:", parsed.hostname or "unknown")
          PY

          python3 scripts/download_image.py "$IMAGE_URL" assets/image

          echo "Downloaded file:"
          ls -lh assets/image
          file assets/image

          echo "Validating downloaded image with FFprobe..."

          if ! ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 \
            assets/image; then

            echo "::error::Downloaded file could not be decoded as an image."
            exit 1
          fi


      - name: Inspect source image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_DIMENSIONS=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width,height \
            -of csv=s=x:p=0 \
            assets/image)

          IFS=x read -r IMAGE_WIDTH IMAGE_HEIGHT <<< "$IMAGE_DIMENSIONS"

          if [[ ! "$IMAGE_WIDTH" =~ ^[0-9]+$ ]] ||
             [[ ! "$IMAGE_HEIGHT" =~ ^[0-9]+$ ]]; then

            echo "Could not determine source image dimensions."
            exit 1
          fi

          echo "IMAGE_WIDTH=$IMAGE_WIDTH" >> "$GITHUB_ENV"
          echo "IMAGE_HEIGHT=$IMAGE_HEIGHT" >> "$GITHUB_ENV"

          echo "Source image: ${IMAGE_WIDTH}x${IMAGE_HEIGHT}"

          if (( IMAGE_WIDTH < 600 || IMAGE_HEIGHT < 600 )); then
            echo "::warning::Source image is only ${IMAGE_WIDTH}x${IMAGE_HEIGHT}. For a sharp Reels video, use an image at least 1080px wide and 1080px high."
          fi


      - name: Select music by market
        shell: bash
        run: |
          set -euo pipefail

          NORMALIZED_MARKET=$(printf '%s' "$MARKET" | tr '[:upper:]' '[:lower:]')

          case "$NORMALIZED_MARKET" in
            a101)
              KEYWORD="a101"
              ;;
            bim)
              KEYWORD="bim"
              ;;
            sok|şok)
              KEYWORD="sok"
              ;;
            *)
              KEYWORD="kontraa"
              ;;
          esac

          MUSIC=$(find Assets/Musics \
            -type f \
            -iname "*${KEYWORD}*.mp3" \
            -print \
            -quit)

          if [[ -z "$MUSIC" ]]; then
            MUSIC=$(find Assets/Musics \
              -type f \
              -iname "*.mp3" \
              -print \
              -quit)
          fi

          if [[ -z "$MUSIC" ]]; then
            echo "No MP3 file was found."
            exit 1
          fi

          echo "MUSIC=$MUSIC" >> "$GITHUB_ENV"
          echo "Selected music: $MUSIC"


      - name: Prepare social overlay
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import textwrap
          from pathlib import Path

          market = os.environ.get("MARKET", "").strip().lower()
          product = " ".join(
              os.environ.get("PRODUCT_NAME", "").split()
          )
          price = " ".join(
              os.environ.get("PRICE", "").split()
          )

          market_labels = {
              "a101": "A101",
              "bim": "BİM",
              "sok": "ŞOK",
              "şok": "ŞOK",
          }

          accent_colors = {
              "a101": "0xE31E24",
              "bim": "0xF2C300",
              "sok": "0xF5C400",
              "şok": "0xF5C400",
          }

          wrapped_product = textwrap.TextWrapper(
              width=29,
              max_lines=3,
              placeholder="…",
              break_long_words=False,
              break_on_hyphens=False,
          ).fill(
              product or "Öne çıkan kampanyalı ürün"
          )

          assets = Path("assets")
          assets.mkdir(exist_ok=True)

          (assets / "market.txt").write_text(
              market_labels.get(
                  market,
                  "MARKET FIRSATI"
              ),
              encoding="utf-8",
          )

          (assets / "product_name.txt").write_text(
              wrapped_product,
              encoding="utf-8",
          )

          (assets / "price.txt").write_text(
              price or "Güncel fiyatı inceleyin",
              encoding="utf-8",
          )

          accent_color = accent_colors.get(
              market,
              "0x20C997"
          )

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8",
          ) as env_file:
              env_file.write(
                  f"ACCENT_COLOR={accent_color}\n"
              )
          PY


      - name: Render Reels video
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p public/videos
          mkdir -p public/manifests

          OUTPUT_FILE="public/videos/$REQUEST_ID.mp4"

          timeout 180s ffmpeg \
            -nostdin \
            -y \
            -loop 1 \
            -framerate 30 \
            -i assets/image \
            -i "$MUSIC" \
            -t "$DURATION_SECONDS" \
            -filter_complex "[0:v]scale=1080:1920:force_original_aspect_ratio=increase:flags=lanczos,crop=1080:1920,gblur=sigma=38,eq=brightness=-0.42:saturation=0.72[background];[background]drawbox=x=0:y=0:w=1080:h=1920:color=0x07111F@0.62:t=fill,drawbox=x=70:y=430:w=940:h=900:color=white@0.98:t=fill,drawbox=x=70:y=430:w=940:h=12:color=${ACCENT_COLOR}:t=fill[base];[0:v]scale=820:790:force_original_aspect_ratio=decrease:flags=lanczos,unsharp=5:5:0.55:5:5:0.0,pad=860:820:(ow-iw)/2:(oh-ih)/2:color=white[product];[base][product]overlay=(W-w)/2:475:shortest=1,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='İNDİRİM SERVİSİ':fontcolor=white:fontsize=36:x=70:y=92:box=1:boxcolor=0xFFFFFF@0.12:boxborderw=18,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='GÜNÜN ÖNE ÇIKAN FIRSATI':fontcolor=white:fontsize=55:x=70:y=205,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:textfile=assets/market.txt:fontcolor=${ACCENT_COLOR}:fontsize=48:x=70:y=305,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:textfile=assets/product_name.txt:fontcolor=white:fontsize=45:line_spacing=14:x=(w-text_w)/2:y=1370,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:textfile=assets/price.txt:fontcolor=0x07111F:fontsize=68:x=(w-text_w)/2:y=1585:box=1:boxcolor=${ACCENT_COLOR}@0.98:boxborderw=24,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='Kampanya ve stok bilgileri mağazaya göre değişebilir.':fontcolor=white@0.84:fontsize=27:x=(w-text_w)/2:y=1792,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='indirimservisi.com':fontcolor=white:fontsize=34:x=(w-text_w)/2:y=1845,fade=t=in:st=0:d=0.45,fade=t=out:st=9.4:d=0.6,format=yuv420p[v]" \
            -map "[v]" \
            -map 1:a \
            -r 30 \
            -c:v libx264 \
            -preset medium \
            -crf 18 \
            -profile:v high \
            -level 4.1 \
            -c:a aac \
            -b:a 192k \
            -ar 48000 \
            -shortest \
            -movflags +faststart \
            "$OUTPUT_FILE"

          echo "Rendered video:"

          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height,pix_fmt,r_frame_rate \
            -of default=noprint_wrappers=1 \
            "$OUTPUT_FILE"


      - name: Create Reels cover
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p public/covers

          ffmpeg \
            -nostdin \
            -y \
            -ss 1 \
            -i "public/videos/$REQUEST_ID.mp4" \
            -frames:v 1 \
            -q:v 2 \
            "public/covers/$REQUEST_ID.jpg"

          echo "Rendered cover:"

          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 \
            "public/covers/$REQUEST_ID.jpg"


      - name: Create manifest
        shell: bash
        env:
          VIDEO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/videos/${{ inputs.requestId }}.mp4
          COVER_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/covers/${{ inputs.requestId }}.jpg

        run: |
          set -euo pipefail

          NORMALIZED_MARKET=$(printf '%s' "$MARKET" | tr '[:upper:]' '[:lower:]')

          case "$NORMALIZED_MARKET" in

            a101)
              MARKET_LABEL="A101"
              HASHTAGS="#A101 #AldınAldın #İndirim #Fırsat #AktüelÜrünler #MarketFırsatları"
              ;;

            bim)
              MARKET_LABEL="BİM"
              HASHTAGS="#BİM #İndirim #Fırsat #AktüelÜrünler #MarketFırsatları"
              ;;

            sok|şok)
              MARKET_LABEL="ŞOK"
              HASHTAGS="#ŞOK #İndirim #Fırsat #AktüelÜrünler #MarketFırsatları"
              ;;

            *)
              MARKET_LABEL="${MARKET:-Market}"
              HASHTAGS="#İndirim #Fırsat #AktüelÜrünler #MarketFırsatları"
              ;;

          esac

          if [[ -n "$PRODUCT_NAME" && -n "$PRICE" ]]; then

            CAPTION=$(printf \
              "✨ Günün Öne Çıkan Fırsatı\n\n🛒 %s\n%s\n✨ Fiyat: %s\n\nKampanya ve stok bilgileri mağazaya göre değişebilir.\nGüncel fırsatlar: indirimservisi.com\n\nBeğendiysen kaydetmeyi ve alışveriş listene eklemeyi unutma.\n\n#İndirimServisi %s" \
              "$MARKET_LABEL" \
              "$PRODUCT_NAME" \
              "$PRICE" \
              "$HASHTAGS")

          elif [[ -n "$PRODUCT_NAME" ]]; then

            CAPTION=$(printf \
              "✨ Günün Öne Çıkan Fırsatı\n\n🛒 %s\n%s\n\nKampanya ve stok bilgileri mağazaya göre değişebilir.\nGüncel fırsatlar: indirimservisi.com\n\n#İndirimServisi %s" \
              "$MARKET_LABEL" \
              "$PRODUCT_NAME" \
              "$HASHTAGS")

          else

            CAPTION=$(printf \
              "✨ %s için öne çıkan fırsat\n\nKampanya ve stok bilgileri mağazaya göre değişebilir.\nGüncel fırsatlar: indirimservisi.com\n\n#İndirimServisi %s" \
              "$MARKET_LABEL" \
              "$HASHTAGS")

          fi

          jq -n \
            --arg requestId "$REQUEST_ID" \
            --arg videoUrl "$VIDEO_URL" \
            --arg coverUrl "$COVER_URL" \
            --arg market "$MARKET" \
            --arg productName "$PRODUCT_NAME" \
            --arg price "$PRICE" \
            --arg caption "$CAPTION" \
            --argjson sourceWidth "$IMAGE_WIDTH" \
            --argjson sourceHeight "$IMAGE_HEIGHT" \
            --arg createdAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              requestId: $requestId,
              videoUrl: $videoUrl,
              coverUrl: $coverUrl,
              market: $market,
              productName: $productName,
              price: $price,
              caption: $caption,
              sourceWidth: $sourceWidth,
              sourceHeight: $sourceHeight,
              createdAt: $createdAt
            }' \
            > "public/manifests/$REQUEST_ID.json"

          echo "Manifest created:"
          cat "public/manifests/$REQUEST_ID.json"


      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
