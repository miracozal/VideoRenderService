name: Render Video

on:
  workflow_dispatch:
    inputs:
      imageUrl:
        description: Public HTTP/HTTPS image URL
        required: true
        type: string
      market:
        description: Market music selection
        required: true
        type: string
      durationSeconds:
        description: Video duration between 3 and 30 seconds
        required: true
        default: "10"
        type: string
      requestId:
        description: Unique output identifier
        required: true
        type: string
      productName:
        description: Product name used in the Instagram caption
        required: false
        default: ""
        type: string
      price:
        description: Optional product price used in the Instagram caption
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: github-pages-video-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE_URL: ${{ inputs.imageUrl }}
      MARKET: ${{ inputs.market }}
      DURATION_SECONDS: ${{ inputs.durationSeconds }}
      REQUEST_ID: ${{ inputs.requestId }}
      PRODUCT_NAME: ${{ inputs.productName }}
      PRICE: ${{ inputs.price }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$DURATION_SECONDS" =~ ^[0-9]+$ ]] ||
             (( DURATION_SECONDS < 3 || DURATION_SECONDS > 30 )); then
            echo "durationSeconds must be an integer between 3 and 30."
            exit 1
          fi

          if [[ ! "$REQUEST_ID" =~ ^[A-Za-z0-9_-]{1,64}$ ]]; then
            echo "requestId may only contain letters, numbers, underscores and hyphens."
            exit 1
          fi

          if (( ${#MARKET} > 30 )); then
            echo "market may contain at most 30 characters."
            exit 1
          fi

          if (( ${#PRODUCT_NAME} > 150 )); then
            echo "productName may contain at most 150 characters."
            exit 1
          fi

          if (( ${#PRICE} > 30 )); then
            echo "price may contain at most 30 characters."
            exit 1
          fi

      - name: Install FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download image safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          python3 scripts/download_image.py "$IMAGE_URL" assets/image
          file assets/image

      - name: Inspect source image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_DIMENSIONS=$(ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=width,height \
            -of csv=s=x:p=0 \
            assets/image)

          IFS=x read -r IMAGE_WIDTH IMAGE_HEIGHT <<< "$IMAGE_DIMENSIONS"

          if [[ ! "$IMAGE_WIDTH" =~ ^[0-9]+$ ]] || [[ ! "$IMAGE_HEIGHT" =~ ^[0-9]+$ ]]; then
            echo "Could not determine source image dimensions."
            exit 1
          fi

          echo "IMAGE_WIDTH=$IMAGE_WIDTH" >> "$GITHUB_ENV"
          echo "IMAGE_HEIGHT=$IMAGE_HEIGHT" >> "$GITHUB_ENV"
          echo "Source image: ${IMAGE_WIDTH}x${IMAGE_HEIGHT}"

          if (( IMAGE_WIDTH < 600 || IMAGE_HEIGHT < 600 )); then
            echo "::warning::Source image is only ${IMAGE_WIDTH}x${IMAGE_HEIGHT}. For a sharp Reels video, use an image at least 1080px wide and 1080px high."
          fi

      - name: Select music by market
        shell: bash
        run: |
          set -euo pipefail

          NORMALIZED_MARKET=$(printf '%s' "$MARKET" | tr '[:upper:]' '[:lower:]')

          case "$NORMALIZED_MARKET" in
            a101) KEYWORD="a101" ;;
            bim) KEYWORD="bim" ;;
            sok|şok) KEYWORD="sok" ;;
            *) KEYWORD="kontraa" ;;
          esac

          MUSIC=$(find Assets/Musics -type f -iname "*${KEYWORD}*.mp3" -print -quit)
          if [[ -z "$MUSIC" ]]; then
            MUSIC=$(find Assets/Musics -type f -iname "*.mp3" -print -quit)
          fi

          if [[ -z "$MUSIC" ]]; then
            echo "No MP3 file was found."
            exit 1
          fi

          echo "MUSIC=$MUSIC" >> "$GITHUB_ENV"
          echo "Selected music: $MUSIC"

      - name: Render Reels video
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/videos public/manifests

          OUTPUT_FILE="public/videos/$REQUEST_ID.mp4"

          timeout 180s ffmpeg -nostdin -y \
            -loop 1 \
            -framerate 30 \
            -i assets/image \
            -i "$MUSIC" \
            -t "$DURATION_SECONDS" \
            -filter_complex "color=c=0xF3F4F6:s=1080x1920:r=30[canvas];[0:v]scale=900:1400:force_original_aspect_ratio=decrease:flags=lanczos,unsharp=5:5:0.45:5:5:0.0,pad=960:1460:(ow-iw)/2:(oh-ih)/2:color=white[card];[canvas][card]overlay=(W-w)/2:(H-h)/2:shortest=1,format=yuv420p[v]" \
            -map "[v]" \
            -map 1:a \
            -r 30 \
            -c:v libx264 \
            -preset medium \
            -crf 18 \
            -profile:v high \
            -level 4.1 \
            -c:a aac \
            -b:a 192k \
            -ar 48000 \
            -shortest \
            -movflags +faststart \
            "$OUTPUT_FILE"

          ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height,pix_fmt,r_frame_rate \
            -of default=noprint_wrappers=1 \
            "$OUTPUT_FILE"

      - name: Create manifest
        shell: bash
        env:
          VIDEO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/videos/${{ inputs.requestId }}.mp4
        run: |
          set -euo pipefail

          case "$(printf '%s' "$MARKET" | tr '[:upper:]' '[:lower:]')" in
            a101)
              MARKET_LABEL="A101"
              HASHTAGS="#A101 #AldınAldın #İndirim #Fırsat #AktüelÜrünler #MarketFırsatları"
              ;;
            bim)
              MARKET_LABEL="BİM"
              HASHTAGS="#BİM #İndirim #Fırsat #AktüelÜrünler #MarketFırsatları"
              ;;
            sok|şok)
              MARKET_LABEL="ŞOK"
              HASHTAGS="#ŞOK #İndirim #Fırsat #AktüelÜrünler #MarketFırsatları"
              ;;
            *)
              MARKET_LABEL="${MARKET:-Market}"
              HASHTAGS="#İndirim #Fırsat #AktüelÜrünler #MarketFırsatları"
              ;;
          esac

          if [[ -n "$PRODUCT_NAME" && -n "$PRICE" ]]; then
            CAPTION=$(printf "🔥 %s'de kaçırılmayacak fırsat!\n\n%s sadece %s.\n\n🛒 Stoklarla sınırlıdır.\n\n%s" "$MARKET_LABEL" "$PRODUCT_NAME" "$PRICE" "$HASHTAGS")
          elif [[ -n "$PRODUCT_NAME" ]]; then
            CAPTION=$(printf "🔥 %s'de fırsat zamanı!\n\n%s raflarda seni bekliyor.\n\n🛒 Stoklarla sınırlıdır.\n\n%s" "$MARKET_LABEL" "$PRODUCT_NAME" "$HASHTAGS")
          else
            CAPTION=$(printf "🔥 %s'de fırsat zamanı!\n\n🛒 Stoklarla sınırlıdır.\n\n%s" "$MARKET_LABEL" "$HASHTAGS")
          fi

          jq -n \
            --arg requestId "$REQUEST_ID" \
            --arg videoUrl "$VIDEO_URL" \
            --arg market "$MARKET" \
            --arg productName "$PRODUCT_NAME" \
            --arg price "$PRICE" \
            --arg caption "$CAPTION" \
            --argjson sourceWidth "$IMAGE_WIDTH" \
            --argjson sourceHeight "$IMAGE_HEIGHT" \
            --arg createdAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{requestId: $requestId, videoUrl: $videoUrl, market: $market, productName: $productName, price: $price, caption: $caption, sourceWidth: $sourceWidth, sourceHeight: $sourceHeight, createdAt: $createdAt}' \
            > "public/manifests/$REQUEST_ID.json"

      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
