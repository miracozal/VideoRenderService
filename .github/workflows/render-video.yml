name: Render Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create sample image
        run: |
          mkdir -p assets
          convert -size 1080x1920 xc:black assets/image.jpg

      - name: Render video
        run: |
          mkdir -p public

          ffmpeg -y \
            -loop 1 \
            -i assets/image.jpg \
            -t 8 \
            -vf "format=yuv420p" \
            -r 30 \
            -c:v libx264 \
            public/latest.mp4

      - name: Create json manifest
        run: |
          echo "{\"videoUrl\":\"https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/latest.mp4\"}" > public/latest.json

      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public