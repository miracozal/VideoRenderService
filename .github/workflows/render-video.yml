name: Render Video

on:
  workflow_dispatch:
    inputs:
      imageUrl:
        description: Public HTTP/HTTPS image URL
        required: true
        type: string
      market:
        description: Market music selection
        required: true
        type: string
      durationSeconds:
        description: Video duration between 3 and 30 seconds
        required: true
        default: "10"
        type: string
      requestId:
        description: Unique output identifier
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: github-pages-video-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE_URL: ${{ inputs.imageUrl }}
      MARKET: ${{ inputs.market }}
      DURATION_SECONDS: ${{ inputs.durationSeconds }}
      REQUEST_ID: ${{ inputs.requestId }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$DURATION_SECONDS" =~ ^[0-9]+$ ]] ||
             (( DURATION_SECONDS < 3 || DURATION_SECONDS > 30 )); then
            echo "durationSeconds must be an integer between 3 and 30."
            exit 1
          fi

          if [[ ! "$REQUEST_ID" =~ ^[A-Za-z0-9_-]{1,64}$ ]]; then
            echo "requestId may only contain letters, numbers, underscores and hyphens."
            exit 1
          fi

          if (( ${#MARKET} > 30 )); then
            echo "market may contain at most 30 characters."
            exit 1
          fi

      - name: Install FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download image safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          python3 scripts/download_image.py "$IMAGE_URL" assets/image
          file assets/image

      - name: Select music by market
        shell: bash
        run: |
          set -euo pipefail

          NORMALIZED_MARKET=$(printf '%s' "$MARKET" | tr '[:upper:]' '[:lower:]')

          case "$NORMALIZED_MARKET" in
            a101) KEYWORD="a101" ;;
            bim) KEYWORD="bim" ;;
            sok|şok) KEYWORD="sok" ;;
            *) KEYWORD="kontraa" ;;
          esac

          MUSIC=$(find Assets/Musics -type f -iname "*${KEYWORD}*.mp3" -print -quit)
          if [[ -z "$MUSIC" ]]; then
            MUSIC=$(find Assets/Musics -type f -iname "*.mp3" -print -quit)
          fi

          if [[ -z "$MUSIC" ]]; then
            echo "No MP3 file was found."
            exit 1
          fi

          echo "MUSIC=$MUSIC" >> "$GITHUB_ENV"
          echo "Selected music: $MUSIC"

      - name: Render Reels video
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/videos public/manifests

          OUTPUT_FILE="public/videos/$REQUEST_ID.mp4"

          timeout 180s ffmpeg -nostdin -y \
            -loop 1 \
            -framerate 30 \
            -i assets/image \
            -i "$MUSIC" \
            -t "$DURATION_SECONDS" \
            -filter_complex "[0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,boxblur=20:1[bg];[0:v]scale=900:1600:force_original_aspect_ratio=decrease[fg];[bg][fg]overlay=(W-w)/2:(H-h)/2,zoompan=z='min(zoom+0.0007,1.06)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=1:s=1080x1920:fps=30,format=yuv420p[v]" \
            -map "[v]" \
            -map 1:a \
            -r 30 \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -profile:v high \
            -level 4.1 \
            -c:a aac \
            -b:a 192k \
            -ar 48000 \
            -shortest \
            -movflags +faststart \
            "$OUTPUT_FILE"

          ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height,pix_fmt,r_frame_rate \
            -of default=noprint_wrappers=1 \
            "$OUTPUT_FILE"

      - name: Create manifest
        shell: bash
        env:
          VIDEO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/videos/${{ inputs.requestId }}.mp4
        run: |
          set -euo pipefail

          jq -n \
            --arg requestId "$REQUEST_ID" \
            --arg videoUrl "$VIDEO_URL" \
            --arg market "$MARKET" \
            --arg createdAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{requestId: $requestId, videoUrl: $videoUrl, market: $market, createdAt: $createdAt}' \
            > "public/manifests/$REQUEST_ID.json"

      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
