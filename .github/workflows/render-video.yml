name: Render Video

on:
  workflow_dispatch:
    inputs:
      imageUrl:
        required: true
        type: string
      market:
        required: true
        type: string
      durationSeconds:
        required: true
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download image
        run: |
          mkdir -p assets
          curl -L "${{ github.event.inputs.imageUrl }}" -o assets/image.jpg

      - name: Render video
        run: |
          mkdir -p public

          ffmpeg -y \
            -loop 1 \
            -i assets/image.jpg \
            -t "${{ github.event.inputs.durationSeconds }}" \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,format=yuv420p" \
            -r 30 \
            -c:v libx264 \
            public/latest.mp4

      - name: Create manifest
        run: |
          echo "{\"videoUrl\":\"https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/latest.mp4\",\"market\":\"${{ github.event.inputs.market }}\"}" > public/latest.json

      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public